services:

  # ── Pipeline ──────────────────────────────────────────────────────
  # Runs the discovery scan + classification pipeline.
  # Not started by default (use `docker compose run pipeline ...`).
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # GitHub — token preferred; gh CLI fallback not available in container
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORGS: ${GITHUB_ORGS:-agilecontent}

      # GitLab (optional)
      GITLAB_TOKEN:  ${GITLAB_TOKEN:-}
      GITLAB_URL:    ${GITLAB_URL:-https://gitlab.com}
      GITLAB_GROUPS: ${GITLAB_GROUPS:-}

      # Vertex AI — uses ADC mounted below; no API key needed
      GOOGLE_CLOUD_PROJECT:    ${GOOGLE_CLOUD_PROJECT}
      ANTHROPIC_VERTEX_REGION: ${ANTHROPIC_VERTEX_REGION:-europe-west1}
      ANTHROPIC_MODEL:         ${ANTHROPIC_MODEL:-}

      # Thresholds
      STALE_COMMIT_DAYS: ${STALE_COMMIT_DAYS:-180}
      DEAD_COMMIT_DAYS:  ${DEAD_COMMIT_DAYS:-365}
    volumes:
      # Pipeline outputs (CSV, JSON, HTML) persist on the host
      - ./output:/app/output
      - ./architecture-overview:/app/architecture-overview
      # GCP Application Default Credentials (set by `gcloud auth application-default login`)
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      # taxonomy and cache survive rebuilds
      - ./discovery/taxonomy.json:/app/discovery/taxonomy.json:ro
      - ./architecture-overview/.cache:/app/architecture-overview/.cache
    profiles:
      - pipeline   # only starts with: docker compose --profile pipeline up

  # ── Viewer ────────────────────────────────────────────────────────
  # Serves the generated index.html on port 8080.
  # Reads from the live output volume so it reflects the latest run.
  viewer:
    image: nginx:alpine
    ports:
      - "${VIEWER_PORT:-8080}:80"
    volumes:
      - ./architecture-overview:/usr/share/nginx/html:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

configs:
  nginx_conf:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;
        gzip on;
        gzip_types text/html application/javascript application/json;
        location / {
          add_header Cache-Control "no-store";
          try_files $$uri /index.html;
        }
      }
